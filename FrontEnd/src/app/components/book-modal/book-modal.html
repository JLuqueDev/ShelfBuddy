<div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="bookModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <header class="modal-header">
                <h2 class="h5 modal-title" id="bookModalTitle">
                    {{ bookToEdit ? 'Edit book details:' : 'Type book details here:' }}
                </h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </header>

            <div class="modal-body">

                <form (ngSubmit)="onSubmit()">
                    <fieldset>
                        <legend class="visually-hidden">Book form</legend>
                        <div class="mb-3">
                            <label for="title" class="form-label">Book Title</label>
                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                name="title"
                                [(ngModel)]="title"
                                placeholder="e.g. Dune"
                                required />
                        </div>
                        <div class="mb-3">
                            <label for="author" class="form-label">Author</label>
                            <input
                                type="text"
                                class="form-control"
                                id="author"
                                name="author"
                                [(ngModel)]="author"
                                placeholder="e.g. Frank Herbert"
                                required />
                        </div>
                        <div class="mb3">
                            <label for="status" class="form-label">Reading status</label>
                            <select class="form-select" name="status" id="status" [(ngModel)]="status">
                                <option value="To read">To read</option>
                                <option value="Reading">Reading</option>
                                <option value="Finished">Finished</option>
                            </select>
                        </div>
                    </fieldset>
                    <footer class="d-flex justify-content-end gap-2 mt-2">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">
                            {{ bookToEdit ? 'Save changes' : 'Save book'}}
                        </button>
                    </footer>
                </form>
            </div>
        </div>
    </div>
</div>
