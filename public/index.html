<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelfBuddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/ShelfBuddy.css" rel="stylesheet"/> 
</head>
<body>                          
<!-- Header -->
    <header class="d-flex justify-content-between p-3">
        <button class="btn btn-outline-secondary" type="button" id="theme-toggle">🌙 Dark Mode</button>
        <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#loginModal">Login || Register</button>
    </header>

    <main class="container d-flex flex-column justify-content-center align-items-center hero-section">

        <!-- Hero  -->        
        <section class="text-center mb-4">
            <button class="logo display-1" type="button" title="Check your library!">📚</button>
            <h1 class="fw-bold">ShelfBuddy</h1>
            <p class="text-muted catch-phrase" data-hover="Tracking my reading journey!"></p>
        </section>

        <!-- Search Area -->
        <search class="w-100 mb-4" style="max-width: 600px;">
            <form class="d-flex flex-column gap-3" id="search-form" onsubmit="event.preventDefault();">
                <input type="search" class="form-control form-control-lg rounded-pill shadow-sm" placeholder="Search by title or author..." aria-label="Search Library">
                <div class="d-flex justify-content-center gap-2">
                    <button class="btn btn-light border" type="submit">Search Library</button>
                    <button class="btn btn-light border" type="button" data-bs-toggle="modal" data-bs-target="#addBookModal">Add New Book</button>
                </div>
            </form>
        </search>

        <!-- bookList (imbeued from JS)-->
        <div class="bookList row g-4"></div>

    </main>

    <!-- Footer -->
    <footer class="text-center p-3 text-muted small">
        <p>&copy; 2026 ShelfBuddy | <a href="#" class="text-decoration-none text-muted">About</a> | <a href="#" class="text-decoration-none text-muted">GitHub</a></p>
    </footer>

    <!-- Login modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <header class="modal-header row border-0">
                    <h2 class=" h5 modal-title text-center col-11 fw-bold ">Log into your Shelf!</h2>
                    <button type="button" class="btn-close col-1 mx-0" data-bs-dismiss="modal" aria-label="Close"></button>
                </header>

                <div class="modal-body">

                    <form id="logInForm">
                        <fieldset>
                            <legend class="visually-hidden">Login form</legend>
                            <div class="mb-3">
                                <label for="loginIdentifier" class="form-label">Username/Email</label>
                                <input type="text" class="form-control" id="loginIdentifier" name="loginIdentifier" required>
                            </div>
                            <div class="mb-4">
                                <label for="loginPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="loginPassword" name="loginPassword" required>
                            </div>
                        </fieldset>

                        <footer>
                            <button type="submit" class="btn btn-primary mb-4 w-100">Login</button>
                            <p>Don't have an account? <a class="text-decoration-none" role="button" data-bs-toggle="modal" data-bs-target="#signUpModal">Sign up!</a></p>
                        </footer>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- new book form/modal -->
    <div class="modal fade" id="addBookModal" role="form" tabindex="-1" aria-labelledby="addBookModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <header class="modal-header">
                    <h2 class=" h5 modal-title" id="addBookModalTitle">Type book details here:</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </header>

                <div class="modal-body">

                    <form id="add-book-form">
                        <fieldset>
                            <legend class="visually-hidden">Book details form</legend>
                            <div class="mb-3">
                                <label for="title" class="form-label">Book Title</label>
                                <input type="text" class="form-control" id="title" placeholder="e.g. Dune" required />
                            </div>
                            <div class="mb-3">
                                <label for="author" class="form-label">Author</label>
                                <input type="text" class="form-control" id="author" placeholder="e.g. Frank Herbert" required />
                            </div>
                            <div class="mb-3">
                                <label for="status" class="form-label">Reading Status</label>
                                <select class="form-select" id="status">
                                    <option value="To read" selected>To read</option>
                                    <option value="Reading">Reading</option>
                                    <option value="Finished">Finished</option>
                                </select>
                            </div>
                        </fieldset>
                        
                        <footer class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Book</button>
                        </footer>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit book modal/form -->
    <div class="modal fade" id="editBookModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <header class="modal-header">
                    <h2 class=" h5 modal-title">Edit Book Details</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </header>

                <div class="modal-body">

                    <form id="edit-book-form">
                        <fieldset>
                            <legend class="visually-hidden">Edit book details form</legend>
                            <div class="mb-3">
                                <label for="edit-title" class="form-label">Book Title</label>
                                <input type="text" class="form-control" id="edit-title" required />
                            </div>
                            <div class="mb-3">
                                <label for="edit-author" class="form-label">Author</label>
                                <input type="text" class="form-control" id="edit-author" required />
                            </div>
                            <div class="mb-3">
                                <label for="edit-status" class="form-label">Reading Status</label>
                                <select class="form-select" id="edit-status">
                                    <option value="To read">To read</option>
                                    <option value="Reading">Reading</option>
                                    <option value="Finished">Finished</option>
                                </select>
                            </div>
                        </fieldset>

                        <footer class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-info text-white">Save Changes</button>
                        </footer>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Register -->
    <div class="modal fade" id="signUpModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                
                <header class="modal-header row border-0">
                    <h2 class=" h5 modal-title text-center col-11 fw-bold ">Create your account!</h2>
                    <button type="button" class="btn-close col-1 mx-0" data-bs-dismiss="modal" aria-label="Close"></button>
                </header>
                

                <div class="modal-body">

                    <form id="registerForm">
                        <fieldset>
                            <legend class="visually-hidden">Register form</legend>
                            <div class="mb-3">
                                <label for="signUpUsername" class="form-label">Username</label>
                                <input type="text" class="form-control" id="signUpUsername" name="signUpUsername" required>
                            </div>
                            <div class="mb-3">
                                <label for="signUpEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="signUpEmail" name="signUpEmail" required>
                            </div>
                            <div class="mb-4">
                                <label for="signUpPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="signUpPassword" name="signUpPassword" required>
                            </div>
                        </fieldset>

                        <footer>
                            <button type="submit" class="btn btn-primary mb-4 w-100">Register</button>
                        </footer>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
