<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelfBuddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/ShelfBuddy.css" rel="stylesheet"/> 
</head>
<body>                          
    <!-- Header -->
    <header class="d-flex justify-content-between p-3">
        <button class="btn btn-outline-secondary" id="theme-toggle">🌙 Dark Mode</button>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#loginModal">Sign In</button>
    </header>
    <!-- Hero  -->
    <main class="container d-flex flex-column justify-content-center align-items-center hero-section">
        <div class="text-center mb-4">
            <h1 class="display-1">📚</h1>
            <h2 class="fw-bold">ShelfBuddy</h2>
            <p class="text-muted catch-phrase" data-hover="Tracking my reading journey!"></p>
        </div>
        <!-- Search Area -->
        <div class="w-100" style="max-width: 600px;">
            <input type="text" class="form-control form-control-lg rounded-pill mb-4 shadow-sm" placeholder="Search by title or author...">
            <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-light border">Search Library</button>
                <button class="btn btn-light border">Add New Book</button>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer class="text-center p-3 text-muted small">
        <p>&copy; 2026 ShelfBuddy | <a href="#" class="text-decoration-none text-muted">About</a> | <a href="#" class="text-decoration-none text-muted">GitHub</a></p>
    </footer>
    <!-- Login -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Sign In</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="#" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email/Username</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./DOM.js"></script>
</body>
</html>
